# Publica numerasheets.com na Cloudflare Pages por Direct Upload.
#
# Projeto que ja existia (caso B do guia de Cloudflare Pages):
# o projeto `numerasheets-site` ja existia no Pages pela integracao Git. O build
# passa a rodar aqui, e o build automatico do Pages fica DESLIGADO no painel
# (Settings > Build > Branch control) -- sem isso cada push publica duas vezes.
#
# Sem `npm test`: o repo nao tem testes. Os portoes sao `typecheck` e `lint`.
# O `lint` ficou fora ate 02/10/2026 porque faltava o `eslint.config.mjs`; com
# ele, acusou 7 erros reais (6 `<a>` internos no lugar de `<Link>` e um
# setState dentro de efeito no `Reveal`). Script de verificacao fora do CI
# apodrece sem ninguem ver. E o lint so ve `href` literal: outros 5 links
# internos, com href montado, so apareceram clicando no ar (02/10/2026).
#
# Sem `workflow_run`: nao ha cron que faca commit neste repo.

name: Publicar na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/publicar-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: publicar-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.141.0
  PROJETO: numerasheets-site

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v4 rodava em Node 20, descontinuado (10/10/2026). Da v5 a v7 nada nos
      # quebra: o `cache: npm` abaixo e explicito, e nao ha `packageManager`.
      # Fixadas por SHA (a tag se move); o dependabot sobe o SHA e o comentario.
      # Versao do comentario lida na API do GitHub em 20/10/2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: O _headers chegou na saida
        run: |
          test -f out/_headers
          grep -q "X-Robots-Tag: noindex" out/_headers
      # Caso B: o projeto TEM de existir. Criar um novo aqui seria publicar
      # num projeto sem o dominio -- entao falhar e o comportamento certo.
      - name: O projeto existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" pages project list | grep -qw "$PROJETO"
      - name: Enviar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy out
          --project-name="$PROJETO"
          --branch="${GITHUB_REF_NAME}"
          --commit-hash="$(git rev-parse HEAD)"
