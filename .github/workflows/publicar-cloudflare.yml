# Publica numerasheets.com na Cloudflare Pages por Direct Upload.
#
# Desenho do guia `GUIA-CLOUDFLARE-PAGES.md` (raiz de ClaudeProjects), caso B:
# o projeto `numerasheets-site` ja existia no Pages pela integracao Git. O build
# passa a rodar aqui, e o build automatico do Pages fica DESLIGADO no painel
# (Settings > Build > Branch control) -- sem isso cada push publica duas vezes.
#
# Sem `npm test`: o repo nao tem testes. O portao e o `typecheck`. O `lint` nao
# entra porque o repo nao tem configuracao de ESLint e ele falha por isso, nao
# por defeito no codigo (medido em 27/09/2026).
#
# Sem `workflow_run`: nao ha cron que faca commit neste repo.

name: Publicar na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/publicar-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: publicar-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.141.0
  PROJETO: numerasheets-site

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: O _headers chegou na saida
        run: |
          test -f out/_headers
          grep -q "X-Robots-Tag: noindex" out/_headers
      # Caso B: o projeto TEM de existir. Criar um novo aqui seria publicar
      # num projeto sem o dominio -- entao falhar e o comportamento certo.
      - name: O projeto existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" pages project list | grep -qw "$PROJETO"
      - name: Enviar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy out
          --project-name="$PROJETO"
          --branch="${GITHUB_REF_NAME}"
          --commit-hash="$(git rev-parse HEAD)"
